services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sgdv_app

    ports:
      - "8080:80"
      - "5173:5173"

    volumes:
      - ./src:/var/www/html

    depends_on:
      - mysql


  mysql:
    image: mysql:8.0

    container_name: sgdv_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sgdv
      MYSQL_USER: sgdv
      MYSQL_PASSWORD: sgdv

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql


  phpmyadmin:
    image: phpmyadmin/phpmyadmin

    container_name: sgdv_phpmyadmin

    restart: always

    ports:
      - "8081:80"

    environment:
      PMA_HOST: mysql

    depends_on:
      - mysql


volumes:

  mysql_data:
